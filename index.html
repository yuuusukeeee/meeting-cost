<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会議コスト計算機</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677;
    --border: #d9dde5; --accent: #2f6fde; --accent-soft: #e8f0fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --text: #e7eaf0; --muted: #9aa3b2;
      --border: #333a46; --accent: #6b9cf5; --accent-soft: #22304a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 480px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  .input-row { display: flex; align-items: center; gap: 8px; }
  input {
    flex: 1; width: 100%; font-size: 1.1rem; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .unit { color: var(--muted); min-width: 3em; }
  .result {
    margin-top: 8px; padding: 16px; border-radius: 10px;
    background: var(--accent-soft); text-align: center;
  }
  .result .label { font-size: .85rem; color: var(--muted); }
  .result .total {
    font-size: 2.2rem; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .result .detail { font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>会議コスト計算機</h1>
  <p class="lead">参加人数・会議時間・1時間あたりの単価から、会議にかかる時間コストを計算します。</p>

  <div class="card">
    <div class="field">
      <label for="people">参加人数</label>
      <div class="input-row">
        <input id="people" type="number" inputmode="numeric" min="0" step="1" value="5">
        <span class="unit">人</span>
      </div>
    </div>
    <div class="field">
      <label for="minutes">会議時間</label>
      <div class="input-row">
        <input id="minutes" type="number" inputmode="numeric" min="0" step="5" value="60">
        <span class="unit">分</span>
      </div>
    </div>
    <div class="field">
      <label for="rate">1時間あたりの単価（1人）</label>
      <div class="input-row">
        <input id="rate" type="number" inputmode="numeric" min="0" step="100" value="3000">
        <span class="unit">円</span>
      </div>
    </div>

    <div class="result" aria-live="polite">
      <div class="label">合計コスト</div>
      <div class="total" id="total">¥0</div>
      <div class="detail" id="detail"></div>
    </div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });

  function num(id) {
    const v = parseFloat($(id).value);
    return Number.isFinite(v) && v > 0 ? v : 0;
  }

  function update() {
    const people = num("people");
    const minutes = num("minutes");
    const rate = num("rate");
    const total = people * (minutes / 60) * rate;
    $("total").textContent = yen.format(Math.round(total));
    $("detail").textContent =
      `${people}人 × ${minutes}分 × ${yen.format(rate)}/時` +
      (minutes > 0 ? `（1分あたり ${yen.format(Math.round(total / minutes))}）` : "");
  }

  ["people", "minutes", "rate"].forEach((id) => $(id).addEventListener("input", update));
  update();
</script>
</body>
</html>
